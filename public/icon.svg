<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262D29" />
      <stop offset="100%" stop-color="#141816" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#C9A227" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="220" stroke="url(#goldGrad)" stroke-width="8" fill="none" opacity="0.4" />
  
  <!-- Ticket Body -->
  <g transform="translate(106, 126)">
    <rect x="0" y="0" width="300" height="260" rx="20" fill="#FCFBF8" />
    <path d="M 0 130 A 20 20 0 0 1 0 170" fill="url(#bgGrad)" />
    <path d="M 300 130 A 20 20 0 0 0 300 170" fill="url(#bgGrad)" />
    <line x1="40" y1="150" x2="260" y2="150" stroke="#DDD9CE" stroke-width="4" stroke-dasharray="10 8" />
    
    <!-- Gold Header -->
    <rect x="25" y="30" width="250" height="40" rx="8" fill="url(#goldGrad)" />
    <rect x="40" y="90" width="120" height="20" rx="4" fill="#1D221F" opacity="0.8" />
    <rect x="180" y="90" width="80" height="20" rx="4" fill="#DDD9CE" />
    
    <!-- Verified Badge -->
    <circle cx="150" cy="205" r="34" fill="#C9A227" />
    <path d="M 138 205 L 146 213 L 164 195" fill="none" stroke="#1C1404" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
